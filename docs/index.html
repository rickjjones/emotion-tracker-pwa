<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>LifeLens</title>
    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="manifest.json"> <!-- removed leading slash -->
    <link rel="icon" href="icon-192x192.svg">    <!-- removed leading slash -->
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>LifeLens</h1>
            <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
        </div>

        <!-- Categories editor modal -->
        <div id="categories-edit-modal" class="modal" hidden aria-hidden="true">
            <div class="modal__backdrop" id="categories-edit-backdrop"></div>
            <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="categories-edit-title">
                <h2 id="categories-edit-title">Edit categories and emotions</h2>
                <div id="categories-edit-list"></div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button id="add-category" type="button">Add Category</button>
                    <button id="reset-categories" type="button">Reset to defaults</button>
                    <button id="export-categories" type="button">Export config</button>
                    <button id="import-categories" type="button">Import config</button>
                    <input type="file" id="import-categories-file" accept="application/json" style="display:none">
                </div>
                <div style="margin-top:12px;text-align:right;">
                    <button id="categories-edit-cancel" type="button">Cancel</button>
                    <button id="categories-edit-save" type="button">Save</button>
                </div>
            </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px;">
            <button id="customize-emotions" type="button" title="Choose which emotions appear on the form">Customize Emotions</button>
            <button id="edit-categories" type="button" title="Rename, add or remove categories and emotions">Edit Categories</button>
        </div>

        <!-- The form is rendered dynamically by app.js based on selected categories/emotions -->
        <form id="emotion-form"></form>

        <!-- Shown in place of the form right after a save -->
        <div id="saved-summary" class="saved-summary" hidden>
            <p id="saved-summary-text" class="saved-summary__text"></p>
            <div class="saved-summary__actions">
                <button id="saved-edit" type="button" class="btn-secondary">Edit this entry</button>
                <button id="saved-log-another" type="button">Log another</button>
            </div>
        </div>

        <!-- Categories / emotion selection modal -->
        <div id="categories-modal" class="modal" hidden aria-hidden="true">
            <div class="modal__backdrop" id="categories-backdrop"></div>
            <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="categories-title">
                <h2 id="categories-title">Choose emotions to track</h2>
                <div id="categories-list"></div>
                <div style="margin-top:12px;text-align:right;">
                    <button id="categories-cancel" type="button">Cancel</button>
                    <button id="categories-save" type="button">Save</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="view-history" type="button" aria-expanded="false" aria-controls="emotion-display">View History</button>
            <button id="view-trends" type="button" aria-expanded="false" aria-controls="trends">View Trends</button>
            <button id="export-json" type="button">Export JSON</button>
            <button id="export-csv" type="button">Export CSV</button>
            <button id="export-unsynced" type="button">Export Unsynced</button>
            <button id="undo-last-export" type="button">Undo Last Export</button>
            <button id="import-json" type="button">Import JSON</button>
            <input type="file" id="import-file" accept="application/json" style="display:none">
            <div class="controls__danger">
                <button id="clear-all" type="button">Clear All Entries</button>
            </div>
        </div>
        <p class="helper-text" style="text-align:center;margin:8px 0 0;">Entries you have exported are marked <strong>Exported</strong> in history.</p>

        <section id="trends" class="trends" hidden aria-labelledby="trends-title">
            <div class="trends__header">
                <h2 id="trends-title">Trends</h2>
                <label class="trends__select-label" for="trends-emotion">Emotion</label>
                <select id="trends-emotion"></select>
                <div id="trends-range" class="trends__range" role="group" aria-label="Time range">
                    <button type="button" data-days="7">7 days</button>
                    <button type="button" data-days="30">30 days</button>
                    <button type="button" data-days="90">90 days</button>
                </div>
            </div>
            <div id="trends-chart" class="trends__chart"></div>
            <p id="trends-summary" class="trends__summary"></p>
        </section>

        <div id="emotion-display"></div>

        <!-- Edit a single entry -->
        <div id="entry-edit-modal" class="modal" hidden aria-hidden="true">
            <div class="modal__backdrop" id="entry-edit-backdrop"></div>
            <form id="entry-edit-form" class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="entry-edit-title">
                <h2 id="entry-edit-title">Edit entry</h2>
                <div class="emotion">
                    <label for="entry-edit-time">Date and time</label>
                    <input type="datetime-local" id="entry-edit-time" required>
                </div>
                <div id="entry-edit-fields"></div>
                <div class="emotion note-row">
                    <label for="entry-edit-note">Note</label>
                    <textarea id="entry-edit-note" class="note-field" rows="3"></textarea>
                </div>
                <div style="margin-top:12px;text-align:right;">
                    <button id="entry-edit-cancel" type="button">Cancel</button>
                    <button type="submit">Save changes</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Toasts are written here so screen readers announce them -->
    <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
    <script src="app.js"></script>

        <script>
            // Service worker registration and update flow.
            //
            // A new sw.js installs and then waits. When that happens we show a
            // banner. "Reload now" (or the 10s countdown) tells the waiting
            // worker to skipWaiting; once it takes control (controllerchange)
            // we reload so the page runs the new version. "Cancel" leaves the
            // new worker waiting, and the banner shows again on the next visit.

            // Only reload on controllerchange if the user (or countdown) asked
            // for the update. This avoids reloading on the very first install,
            // when clients.claim() also fires controllerchange.
            let swUpdateRequested = false;
            let swRefreshing = false;

            function activateWaitingWorker(worker) {
                swUpdateRequested = true;
                try { worker.postMessage({ type: 'SKIP_WAITING' }); } catch (e) { console.error(e); }
            }

            // Show a small update bar with a reload button and 10s auto-reload.
            function showUpdateBanner(worker) {
                try {
                    if (document.getElementById('sw-update')) return; // already shown

                    const bar = document.createElement('div');
                    bar.id = 'sw-update';
                    bar.className = 'sw-update';

                    const msg = document.createElement('div');
                    msg.className = 'sw-update__msg';
                    msg.textContent = 'A new version is available. Reloading in 10s...';

                    const actions = document.createElement('div');

                    // Never auto-reload over a half-filled form: wait for the person to choose.
                    const busy = typeof hasUnsavedInput === 'function' && hasUnsavedInput();
                    if (busy) msg.textContent = 'A new version is available. Reload when you are ready.';

                    let seconds = 10;
                    const countdown = busy ? null : setInterval(() => {
                        seconds -= 1;
                        msg.textContent = `A new version is available. Reloading in ${seconds}s...`;
                        if (seconds <= 0) {
                            clearInterval(countdown);
                            msg.textContent = 'Updating...';
                            activateWaitingWorker(worker);
                        }
                    }, 1000);

                    const reloadBtn = document.createElement('button');
                    reloadBtn.className = 'sw-update__btn';
                    reloadBtn.textContent = 'Reload now';
                    reloadBtn.addEventListener('click', () => {
                        clearInterval(countdown);
                        msg.textContent = 'Updating...';
                        activateWaitingWorker(worker);
                    });

                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'sw-update__btn sw-update__btn--secondary';
                    cancelBtn.textContent = busy ? 'Later' : 'Cancel';
                    cancelBtn.addEventListener('click', () => {
                        clearInterval(countdown);
                        bar.remove();
                    });

                    actions.appendChild(reloadBtn);
                    actions.appendChild(cancelBtn);

                    bar.appendChild(msg);
                    bar.appendChild(actions);
                    document.body.appendChild(bar);
                } catch (e) { console.error(e); }
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!swUpdateRequested || swRefreshing) return;
                    swRefreshing = true;
                    window.location.reload();
                });

                // Try fetching sw.js first to get clearer errors (404 or wrong MIME type)
                fetch('sw.js', { cache: 'no-store' }).then(resp => {
                    if (!resp.ok) throw new Error('sw.js fetch failed: ' + resp.status + ' ' + resp.statusText);
                    return navigator.serviceWorker.register('sw.js', { scope: './' });
                }).then(reg => {
                    console.log('Service worker registered:', reg);
                    // An update that installed earlier and is still waiting
                    if (reg.waiting && navigator.serviceWorker.controller) {
                        showUpdateBanner(reg.waiting);
                    }
                    reg.addEventListener('updatefound', () => {
                        const installing = reg.installing;
                        if (!installing) return;
                        installing.addEventListener('statechange', () => {
                            // Only an update if a worker already controls the page
                            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                                showUpdateBanner(installing);
                            }
                        });
                    });
                }).catch(err => {
                    console.error('Service worker registration failed:', err);
                    // Show a small notice in the page to help debugging on mobile devices
                    try {
                        const el = document.createElement('div');
                        el.textContent = 'Service Worker failed: ' + (err && err.message ? err.message : String(err));
                        el.style.position = 'fixed';
                        el.style.left = '12px';
                        el.style.bottom = '12px';
                        el.style.background = '#c0392b';
                        el.style.color = '#fff';
                        el.style.padding = '8px 10px';
                        el.style.borderRadius = '6px';
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 8000);
                    } catch (e) {
                        // ignore
                    }
                });
            }
        </script>
</body>
</html>
